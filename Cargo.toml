[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
bytemuck = { version = "1", features = ["extern_crate_alloc"] }
rand = "0.9"
rocksdb = "0.23"
tempfile = "3"
thiserror = "2"

izzydb-core = { path = "crates/izzydb-core" }
izzydb-rabitq = { path = "crates/izzydb-rabitq" }
izzydb-storage = { path = "crates/izzydb-storage" }
