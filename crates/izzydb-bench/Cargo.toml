[package]
name = "izzydb-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Benchmarks for izzydb"
publish = false

[features]
io-uring = ["izzydb/io-uring", "izzydb-bulk/io-uring"]

[dependencies]
arrow-array = "55.2"
arrow-schema = "55.2"
izzydb.workspace = true
izzydb-bulk = { path = "../izzydb-bulk" }
parquet = { version = "55.2", default-features = false, features = ["arrow"] }
rand.workspace = true
tempfile.workspace = true
