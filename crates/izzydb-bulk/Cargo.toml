[package]
name = "izzydb-bulk"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Parallel offline Parquet bulk importer for izzydb via external RocksDB SST ingestion"

[features]
io-uring = ["izzydb/io-uring", "izzydb-storage/io-uring", "rocksdb/io-uring"]

[[bin]]
name = "izzydb-import"
path = "src/bin/izzydb-import.rs"

[dependencies]
arrow-array = "55.2"
arrow-schema = "55.2"
bytemuck.workspace = true
clap = { version = "4.5", features = ["derive"] }
izzydb.workspace = true
izzydb-core.workspace = true
izzydb-fts.workspace = true
izzydb-rabitq.workspace = true
izzydb-storage.workspace = true
lz4_flex = "0.11"
memmap2 = "0.9"
parquet = { version = "55.2", default-features = false, features = ["arrow", "snap", "lz4", "zstd"] }
rand.workspace = true
rayon = "1.11"
roaring.workspace = true
rocksdb.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile.workspace = true
